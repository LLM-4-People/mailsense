# Draft release notes for the next tag. The workflow that runs this file never
# publishes: a maintainer reviews the draft and publishes it.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) $AUTHORS"
change-title-escapes: '\<*_&'
no-changes-template: "- No changes."
template: |
  ## Changes

  $CHANGES

categories:
  # The area labels come from .github/labeler.yml. A pull request that touches
  # more than one area appears once, under the first matching area.
  - title: "Console"
    when:
      labels: ["area: console"]
    exclusive: true
  - title: "API and commands"
    when:
      labels: ["area: api"]
    exclusive: true
  - title: "Inference"
    when:
      labels: ["area: inference"]
    exclusive: true
  - title: "Documentation"
    when:
      labels: ["area: docs", "documentation"]
    exclusive: true
  - title: "CI"
    when:
      labels: ["area: ci"]
    exclusive: true
  - title: "Dependencies"
    when:
      labels: ["dependencies"]
    exclusive: true
  - title: "Other changes"

# The resolver reads labels, not titles. The three release labels are set on a
# pull request before it merges; a pull request without one resolves to patch.
# They cannot live under categories: an entry there without a title is not a
# category and is ignored.
version-resolver:
  major:
    labels: ["release: major"]
  minor:
    labels: ["release: minor"]
  patch:
    labels: ["release: patch"]
  default: patch
