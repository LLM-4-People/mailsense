# Draft release notes for the next tag. The workflow that runs this file never
# publishes: a maintainer reviews the draft and publishes it.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) $AUTHORS"
change-title-escapes: '\<*_&'
no-changes-template: "- No changes."
template: |
  ## Changes

  $CHANGES

categories:
  # The area labels come from .github/labeler.yml. A pull request that touches
  # more than one area appears once, under the first matching area.
  - title: "Console"
    when:
      labels: ["area: console"]
    exclusive: true
  - title: "API and commands"
    when:
      labels: ["area: api"]
    exclusive: true
  - title: "Inference"
    when:
      labels: ["area: inference"]
    exclusive: true
  - title: "Documentation"
    when:
      labels: ["area: docs", "documentation"]
    exclusive: true
  - title: "CI"
    when:
      labels: ["area: ci"]
    exclusive: true
  - title: "Dependencies"
    when:
      labels: ["dependencies"]
    exclusive: true
  - title: "Other changes"

  # Version resolution uses the pull request title convention, so a feature
  # moves the minor version even when its area label put it in an area section.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      conventional:
        breaking: true
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      conventional:
        type: "feat"
  - type: "version-resolver"
    semver-increment: "patch"
