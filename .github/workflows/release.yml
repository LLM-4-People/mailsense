name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A tag must never publish a commit that is not on main.
      - name: the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # A tag must never publish a tree the exhaustive gate has not passed.
      - run: scripts/test.sh

  binaries:
    name: linux binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # scripts/build.sh is the one build owner: CGO off, -trimpath, the GUI
      # subsystem for Windows, and the version stamp in internal/buildinfo.
      - name: build the Linux binary
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/build.sh linux
      - name: linux tarball
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          name="mailsense-${VERSION}-linux-amd64"
          mkdir -p "dist/$name/docs/fr"
          cp dist/mailsense "dist/$name/"
          cp packaging/linux/install.sh "dist/$name/"
          cp README.md LICENSE NOTICE "dist/$name/"
          mapfile -t pages < <(go run ./cmd/gensite -pages=en)
          cp --parents "${pages[@]}" "dist/$name/"
          mapfile -t pages_fr < <(go run ./cmd/gensite -pages=fr)
          cp --parents "${pages_fr[@]}" "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  installer:
    name: windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: build the Windows binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/build.sh windows
      - name: install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: compile the installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" "/DAppVersion=$VERSION" "/DSourceExe=$(pwd -W)/dist/mailsense.exe" \
            packaging/windows/mailsense.iss
      # The installer is only useful if the binary it wraps starts. The app
      # writes runtime/api.json once its loopback API is up; stop it through
      # its own API, never by killing the process.
      - name: smoke the built app
        shell: bash
        env:
          MAILSENSE_DATA_DIR: ${{ runner.temp }}/mailsense-smoke
        run: |
          scripts/run-windows.sh
          scripts/stop-windows.sh 30
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*setup.exe
          if-no-files-found: error

  publish:
    name: publish
    needs: [binaries, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
