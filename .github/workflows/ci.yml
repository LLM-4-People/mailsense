name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs on a pull request commit are cancelled. A run on main or a
  # release ref is never cancelled: it is the check the branch protection or
  # release depends on.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The fast gate is one required check but two runners: the lint and vet
  # half and the test half share no state, and running them in series made a
  # 3m36s vet stage sit in front of a 2m07s test stage for no reason.
  lint:
    name: lint and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # scripts/test-fast.sh owns gofmt, script checks, the generated UI
      # bundles, PII, vet and every fast suite. CI does not restate any of
      # them; STAGES=lint runs the first half only.
      - run: scripts/test-fast.sh
        env:
          STAGES: lint
      # The public pages and brand assets are generated from docs/site.json.
      # scripts/test-fast.sh does not read them, so the site check runs here.
      - name: site check
        run: make site-check
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-logs
          path: |
            /tmp/mailsense-vet.*/*.log
            /tmp/*.log
          if-no-files-found: ignore

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/test-fast.sh
        env:
          STAGES: tests
          # The sidecar suite binds loopback ports, so it owns a runner of
          # its own instead of running before the shards.
          SIDECAR: "off"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: |
            /tmp/mailsense-test-fast.*/*.log
            /tmp/*.log
          if-no-files-found: ignore

  sidecar:
    name: sidecar suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/test-fast.sh
        env:
          STAGES: sidecar
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidecar-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  # The ruleset requires the "fast gate" context. This job joins the runners
  # so the required check stays one name while the work runs in parallel.
  fast:
    name: fast gate
    needs: [lint, tests, sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "lint, vet and tests passed"

  exhaustive:
    name: exhaustive gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The release gate is stricter than the fast gate: every package and
      # every tagged configuration.
      - run: scripts/test.sh

  windows:
    name: windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The Outlook connector and the GUI shell are windows-only. A Linux-only
      # CI would never compile the code most likely to break.
      - run: go vet ./...
        shell: bash
      - run: go build ./...
        shell: bash
      # Compile every test binary without running the suites, so a windows-only
      # test file cannot rot unnoticed.
      - run: go test -run '^$' ./...
        shell: bash

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.27"
          go-package: ./...
          repo-checkout: false

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
