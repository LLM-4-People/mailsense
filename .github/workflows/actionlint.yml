name: actionlint

on:
  pull_request:
    paths:
      # A local action edit is checked through the workflows that use it.
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer workflow edit supersedes an older pull request run. A run on main
  # is kept because it is the workflow state the repository depends on.
  group: actionlint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image is pinned by digest, not by tag: rhysd/actionlint 1.7.12.
      - name: run actionlint
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
