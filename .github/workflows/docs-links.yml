name: docs links

on:
  pull_request:
    paths:
      - "docs/**"
      - "internal/site/**"
      - "cmd/gensite/**"
      - "scripts/ci/check-links.mjs"
      - ".nvmrc"
      - ".github/workflows/docs-links.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "internal/site/**"
      - "cmd/gensite/**"
      - "scripts/ci/check-links.mjs"
      - ".nvmrc"
      - ".github/workflows/docs-links.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  internal-links:
    name: internal links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The public site is what Pages deploys: the same Jekyll build with the
      # same baseurl. The checker crawls it over loopback only.
      - name: build the public site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - name: check internal links
        run: |
          node scripts/ci/check-links.mjs \
            --root _site \
            --baseurl-from docs/_config.yml \
            --max-pages 80 \
            --max-links 600 \
            --max-seconds 120 \
            --timeout 5000
