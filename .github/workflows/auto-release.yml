name: auto-release

# The normal path is a merge to main. The ci workflow runs the fast gate and,
# on main, the exhaustive gate; this workflow starts only after that whole
# workflow succeeds and releases the exact commit it tested. A manual dispatch
# is the recovery path for a lost event; it releases the checked-out main.
#
# semantic-release creates the tag and the GitHub release from the conventional
# commits. A tag created with GITHUB_TOKEN does not trigger a push workflow, so
# the release build is dispatched explicitly at the new tag. release.yml still
# refuses a branch ref and verifies the tag is on main.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time. A later merge waits; it must not cancel a release
  # that is creating its tag or dispatching the build.
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: tag and release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the tag and the GitHub release
      actions: write # dispatch release.yml at the new tag
      issues: write # semantic-release comments on released issues
      pull-requests: write # and on released pull requests
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          # semantic-release reads every tag and commit since the last release.
          fetch-depth: 0
          # The GitHub plugin authenticates with GITHUB_TOKEN; no persisted git
          # credential can leak into the release step.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A dispatch can name a branch. Releasing from one would tag a tree that
      # main does not contain; the release workflow would refuse it later, but
      # no tag should be created in the first place. On a workflow_run event
      # GITHUB_SHA is the default-branch tip, not the commit this job checked
      # out, so check HEAD: that is the commit the tag would point at.
      - name: the commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

      # The repository Actions policy allows GitHub-owned actions and a short
      # list of named third parties. A semantic-release action is not on that
      # list, and a blocked action fails the whole run at startup with no job
      # and no log. Install the pinned release tool with npm and run it
      # directly; the only action this workflow uses is GitHub's setup-node.
      - name: Install semantic-release
        shell: bash
        run: |
          set -euo pipefail
          # Pinned versions, matching .releaserc.json. The default npm plugin
          # is deliberately absent: Mailsense is not an npm package; the tag is
          # the product, and release.yml builds the Windows installer.
          npm install --no-save --no-audit --no-fund \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/github@12.0.10

      - name: Create the tag and GitHub release
        id: semantic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/tags-before"
          after="$RUNNER_TEMP/tags-after"
          log="$RUNNER_TEMP/semantic-release.log"

          tag_commit() {
            git ls-remote --tags origin |
              awk -v t="refs/tags/$1" '
                $2 == t { sha = $1 }
                $2 == t "^{}" { peeled = $1 }
                END { print (peeled ? peeled : sha) }
              '
          }

          # semantic-release creates the tag through the API, so the local
          # checkout gains no tag. Snapshot the remote tags and diff them.
          git ls-remote --tags origin > "$before"
          ./node_modules/.bin/semantic-release | tee "$log"

          published=false
          if grep -q "Published release" "$log"; then
            published=true
          fi

          new_tags=()
          for attempt in 1 2 3 4 5; do
            git ls-remote --tags origin > "$after"
            mapfile -t new_tags < <(
              comm -13 <(sort "$before") <(sort "$after") |
                awk '{ print $2 }' |
                sed -E 's#^refs/tags/##; s/\^\{\}$//' |
                sort -u
            )
            if (( ${#new_tags[@]} > 0 )); then
              break
            fi
            if [[ "$published" == false ]]; then
              break
            fi
            if (( attempt == 5 )); then
              echo "error: semantic-release published a release but no new tag is visible" >&2
              exit 1
            fi
            sleep 2
          done

          if (( ${#new_tags[@]} > 1 )); then
            echo "error: semantic-release created more than one tag: ${new_tags[*]}" >&2
            exit 1
          fi
          if (( ${#new_tags[@]} == 0 )); then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release: no commit since the last tag required one."
            exit 0
          fi

          tag="${new_tags[0]}"

          # @semantic-release/github creates the tag at the branch name, not at
          # the commit it analyzed. If main moved while CI ran, the tag can
          # point at a commit that never passed this gate. This job created the
          # tag seconds ago; move it to the commit CI tested before anything
          # builds from it.
          tested="$(git rev-parse HEAD)"
          actual="$(tag_commit "$tag")"
          if [[ "$actual" != "$tested" ]]; then
            echo "tag $tag points at $actual; moving it to the tested $tested" >&2
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$tested" -F force=true >/dev/null
            for attempt in 1 2 3 4 5; do
              actual="$(tag_commit "$tag")"
              if [[ "$actual" == "$tested" ]]; then
                break
              fi
              if (( attempt == 5 )); then
                echo "error: tag $tag still points at $actual, not $tested" >&2
                exit 1
              fi
              sleep 2
            done
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semantic-release created $tag at $tested"

      - name: Dispatch the release build at the new tag
        if: steps.semantic.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semantic.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ -z "$tag" ]]; then
            echo "error: no tag was recorded for the release" >&2
            exit 1
          fi
          # The tag is created through the API. Wait until it is visible, then
          # dispatch release.yml at it; a token-created tag does not start a
          # push workflow on its own.
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "error: tag $tag is not visible after 5 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --ref "$tag"; then
              echo "dispatched release.yml at $tag"
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "error: could not dispatch release.yml at $tag" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Release summary
        if: steps.semantic.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.semantic.outputs.tag }}
        run: |
          {
            echo "### Released $TAG"
            echo ""
            echo "The release workflow builds the Windows installer and attaches the assets."
          } >> "$GITHUB_STEP_SUMMARY"
