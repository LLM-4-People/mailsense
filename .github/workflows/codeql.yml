name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"

permissions:
  security-events: write
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One analysis per language, in parallel. The two databases share no work,
  # and one job analyzing both ran them back to back.
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        if: matrix.language == 'go'
        with:
          suffix: codeql-go
      # One pinned release across every CodeQL step, the same v4.39.1 that
      # scorecard.yml uploads its SARIF with: the action refuses to mix
      # versions inside one workflow, and one version keeps both workflows on
      # one analysis engine.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      # Only Go needs a build. The JavaScript and TypeScript extractor reads
      # the sources directly.
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  # The ruleset requires the "analyze" context. This job keeps that one name
  # while each language analysis runs in parallel.
  analyze-gate:
    name: analyze
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "every language analysis passed"
