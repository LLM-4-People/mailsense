name: scorecard

on:
  # No ruleset requires a scorecard check and no code scanning rule reads it,
  # so a push run only repeats the analysis the weekly schedule already
  # refreshes. Dispatch covers an audit between runs.
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

# The job below grants the only permission this workflow needs. An empty
# workflow level keeps every other scope at none.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Results go to code scanning only. Publishing to the public Scorecard
      # API would need id-token: write, which this workflow does not grant.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
