name: scorecard

on:
  # No ruleset requires a scorecard check and no code scanning rule reads it,
  # so a push run only repeats the analysis the weekly schedule already
  # refreshes. Dispatch covers an audit between runs.
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

# The job below grants the only permission this workflow needs. An empty
# workflow level keeps every other scope at none.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Results go to code scanning only. Publishing to the public Scorecard
      # API would need id-token: write, which this workflow does not grant.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
