name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

# The job below grants the only permission this workflow needs. An empty
# workflow level keeps every other scope at none.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Results go to code scanning only. Publishing to the public Scorecard
      # API would need id-token: write, which this workflow does not grant.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
        with:
          sarif_file: results.sarif
